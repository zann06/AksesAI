version: 2

# Dependabot: pembaruan dependensi otomatis lewat pull request.
#
# Prinsip yang dipakai di repo ini:
#  - Kelompokkan pembaruan minor/patch agar tidak membanjiri halaman PR.
#  - Pembaruan MAJOR sengaja TIDAK dikelompokkan: setiap major butuh dibaca
#    manual, terutama `next` dan `@supabase/*` yang sering mengubah perilaku.
#  - Supabase CLI dipin pada versi tertentu (lihat README §Catatan versi CLI).
#    Karena itu pembaruan `supabase` (devDependency) saya kecualikan: menaikkan
#    CLI ke 3.x akan menolak konfigurasi `[local_smtp]` dan mematahkan CI.
#
# Catatan operasional:
#  - Dependabot menjalankan pnpm dengan `--config.minimum-release-age=4320`
#    (cooldown 3 hari bawaan GitHub, bukan setelan repo ini). Bila suatu run
#    berakhir dengan `ERR_PNPM_NO_MATURE_MATCHING_VERSION`, itu BUKAN
#    konfigurasi yang salah: paketnya memang terlalu baru dan akan lolos
#    sendiri pada jadwal berikutnya. Jangan paksa merge atau melonggarkan
#    jadwal hanya untuk membuat run itu hijau.
#  - `@types/node` sengaja di-ignore untuk major & minor (lihat blok ignore).
updates:
  # ── Dependensi npm ────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    ignore:
      # Pin Supabase CLI: 3.x menolak section [local_smtp] di config.toml.
      - dependency-name: "supabase"
        update-types: ["version-update:semver-major"]
      # `@types/node` harus mengikuti versi Node yang benar-benar dipakai
      # (engines: >=20.19.0 <26, CI memakai Node 22). Menaikkan tipe ke major
      # yang lebih baru membuat TypeScript "mengenal" API Node yang tidak ada
      # saat runtime — typecheck tetap lolos sehingga bug ini tidak terdeteksi
      # CI. Naikkan manual saat engines/CI ikut naik.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # `typescript` 6.x mengubah perilaku pemeriksaan tipe. Karena TS hanya
      # dipakai saat typecheck & build (bukan runtime), upgrade ini murni
      # pekerjaan migrasi: butuh memperbaiki error tipe di banyak berkas dan
      # memverifikasi ulang seluruh build. Belum ada dorongan keamanan
      # (repo ini 0 security alert). PR #6 ditutup dengan alasan ini.
      # Untuk mengupgrade: hapus blok ini, lalu jalankan upgrade dan perbaiki
      # sampai `pnpm typecheck` bersih.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # `jsdom` 31.x juga major. Hanya dipakai lingkungan tes, tidak pernah
      # masuk bundel produksi, sehingga dampaknya ke pengguna nol. PR #7
      # ditutup dengan alasan ini. Sama seperti di atas: hapus blok untuk
      # mengupgrade, lalu pastikan seluruh tes DOM lulus.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
    groups:
      # Semua yang minor/patch digabung agar review-nya sekali jalan.
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      # Perkakas pengembangan tidak memengaruhi runtime produksi.
      dev-tooling:
        applies-to: version-updates
        dependency-type: "development"
        patterns:
          - "eslint*"
          - "prettier*"
          - "typescript*"
          - "vitest*"
          - "@vitest/*"
          - "@playwright/*"

  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
