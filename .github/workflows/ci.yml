name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Batalkan run lama pada branch/PR yang sama ketika ada push baru.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, unit test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Secret scan
        run: node scripts/secret-scan.mjs

      # Build memakai Supabase palsu yang valid secara format: build tidak butuh
      # koneksi database, tetapi env publik harus terparsing oleh skema Zod.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-real

      - name: Client bundle must not contain service_role
        run: node scripts/check-client-bundle.mjs

  rls-and-e2e:
    name: RLS, integration & E2E (Supabase lokal)
    runs-on: ubuntu-latest
    # Uji ini menyalakan Supabase lokal di runner (butuh Docker, tersedia di
    # ubuntu-latest) sehingga ketergantungan eksternal tidak diperlukan.
    #
    # Skema (supabase/config.toml + migrasi + seed) ikut di-commit agar tes RLS
    # benar-benar berjalan pada setiap PR — bukan dilewati. Penjagaan `guard`
    # dipertahankan hanya untuk berjaga bila folder itu tidak ada (mis. fork
    # yang menghapusnya); dalam kondisi normal job ini WAJIB jalan.
    #
    # PENTING: versi Supabase CLI DI-PIN (supabase@2.120.0). Tanpa pin, `npx`
    # mengambil versi terbaru — CLI 3.x menolak section [inbucket] sehingga
    # `supabase start` gagal sebelum satu tes pun berjalan. Naikkan versi ini
    # secara sadar lewat PR tersendiri, bukan otomatis.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cek ketersediaan folder supabase
        id: guard
        run: |
          if [ -f supabase/config.toml ] && [ -d supabase/migrations ]; then
            echo "tersedia=true" >> "$GITHUB_OUTPUT"
            echo "Folder supabase/ ditemukan — menjalankan uji RLS/integration/E2E."
          else
            echo "tersedia=false" >> "$GITHUB_OUTPUT"
            echo "Folder supabase/ tidak ada — uji dilewati."
          fi

      - name: Setup pnpm
        if: steps.guard.outputs.tersedia == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        if: steps.guard.outputs.tersedia == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.guard.outputs.tersedia == 'true'
        run: pnpm install --frozen-lockfile

      - name: Start Supabase local
        if: steps.guard.outputs.tersedia == 'true'
        run: npx --yes supabase@2.120.0 start
        timeout-minutes: 15

      - name: Apply migrations & seed
        if: steps.guard.outputs.tersedia == 'true'
        run: npx --yes supabase@2.120.0 db reset

      - name: Export local Supabase env
        if: steps.guard.outputs.tersedia == 'true'
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(npx --yes supabase@2.120.0 status -o env | grep -E '^ANON_KEY=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(npx --yes supabase@2.120.0 status -o env | grep -E '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"

      - name: RLS & integration tests
        if: steps.guard.outputs.tersedia == 'true'
        run: pnpm test:rls
        env:
          CRON_SECRET: ci-cron-secret-at-least-32-characters-long
          IP_HASH_SALT: ci-ip-hash-salt-at-least-16

      - name: Install Playwright browsers
        if: steps.guard.outputs.tersedia == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        if: steps.guard.outputs.tersedia == 'true'
        run: pnpm test:e2e
        env:
          CI: "true"
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
          CRON_SECRET: ci-cron-secret-at-least-32-characters-long
          IP_HASH_SALT: ci-ip-hash-salt-at-least-16

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: npx --yes supabase@2.120.0 stop --no-backup || true

      - name: Catatan lewati (folder supabase tidak tersedia)
        if: steps.guard.outputs.tersedia != 'true'
        run: |
          echo "::warning::Folder supabase/ tidak ditemukan — uji RLS/integration/E2E dilewati."
          echo "Di repo asal folder ini selalu ada; bila hilang, kembalikan lewat git checkout."
